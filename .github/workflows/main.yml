name: Build OpenWrt for Link NN6000v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-nn6000v2.yml'
      - 'configs/**'

jobs:
  build:
    name: Build NN6000v2 (IPQ6000)
    runs-on: ubuntu-latest    # ⚠️ IPQ6000是ARM64目标，用x86 runner交叉编译即可
                              # ubuntu-22.04-arm 也可以用，但意义不大

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            /usr/local/lib/android /usr/local/share/boost \
            /usr/lib/jvm
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt (main branch, has NN6000v2 support)
        run: |
          git clone --depth 1 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy .config
        run: cp configs/nn6000v2.config openwrt/.config

      - name: Expand config defaults
        working-directory: openwrt
        run: make defconfig

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ hashFiles('openwrt/.config') }}
          restore-keys: openwrt-dl-

      - name: Download package sources
        working-directory: openwrt
        run: make download -j$(nproc) V=s 2>&1 | grep -E "^(ERROR)" || true

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) V=s 2>&1 | tee build.log || \
             make -j1 V=s 2>&1 | tee build.log

      - name: Upload factory & sysupgrade images
        uses: actions/upload-artifact@v4
        with:
          name: nn6000v2-images
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*nn6000v2*factory*.bin
            openwrt/bin/targets/qualcommax/ipq60xx/*nn6000v2*sysupgrade*.bin
            openwrt/bin/targets/qualcommax/ipq60xx/*nn6000v2*initramfs*.itb
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
